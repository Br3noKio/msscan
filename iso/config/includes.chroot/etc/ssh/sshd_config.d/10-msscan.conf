# MSscan (CLAUDE.md 22.5): SSH/SFTP DESLIGADO por padrão; o MSscan liga pela aba Terminal ou com msscan.ssh=1.
# Vem antes do sshd_config da Debian (Include no topo): o primeiro valor de cada opção vale.
# Só o usuário "tecnico" (senha aleatória da sessão, mostrada na tela); nunca root nem o "user" do sistema live.
PermitRootLogin no
AllowUsers tecnico
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 3:50:10
MaxSessions 4
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
# Chaves públicas de MSSCAN/config/ssh_authorized_keys, copiadas para a RAM ao ativar.
AuthorizedKeysFile /run/msscan/ssh/authorized_keys
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
