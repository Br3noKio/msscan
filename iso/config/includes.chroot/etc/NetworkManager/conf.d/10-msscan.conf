# MSscan (CLAUDE.md 28.1): DHCP com espera maior e retentativas sem fim. (IPv6 já não segura a conexão: o padrão do
# NetworkManager é ipv6.may-fail=yes; IPv4 preferido no /etc/gai.conf.)
[main]
# 0 = tenta ativar a conexão automática para sempre (o padrão desiste depois de 4 tentativas).
autoconnect-retries-default=0

[connection]
# Redes de cliente com DHCP lento (switch com STP, relay): 90 s em vez de 45 s.
ipv4.dhcp-timeout=90
