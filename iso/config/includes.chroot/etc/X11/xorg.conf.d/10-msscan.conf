# MSscan — Xorg do quiosque em vídeo de servidor.

# Tela nunca apaga (o técnico pode ficar minutos lendo um relatório).
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

# Vídeo dos BMCs (Matrox G200 do iDRAC/iLO, ASPEED): cursor desenhado por software.
# Precaução: o console virtual do BMC captura o framebuffer; um cursor de hardware (plano
# separado) pode não aparecer nele. A confirmar no console virtual real do iDRAC/iLO.
Section "OutputClass"
    Identifier  "msscan-cursor-bmc"
    MatchDriver "mgag200|ast"
    Driver      "modesetting"
    Option      "SWcursor" "on"
EndSection
