# MSscan — plano B de vídeo: driver "vesa" forçado (msscan-iniciar, -configdir), usado só quando a
# interface não abriu com a autodetecção do Xorg (pedido de 16/10/2026: R620 caiu no modo texto).
# Substitui /etc/X11/xorg.conf.d nesta tentativa: as opções de tela que nunca apaga vão repetidas aqui.

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Device"
    Identifier "msscan-video"
    Driver     "vesa"
EndSection
