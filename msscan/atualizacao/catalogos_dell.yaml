# Cada entrada: o caminho e o MD5 vêm do índice oficial (https://downloads.dell.com/catalog/CatalogIndex.gz e os índices
# anteriores, pelo predecessorPath); o SHA-256 foi calculado do arquivo baixado de lá (MD5 conferido com o índice). Só https
# em downloads.dell.com. Hash diferente: o arquivo é apagado e o catálogo não é usado.

